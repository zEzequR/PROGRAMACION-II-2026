<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paso 1 - Login con Google</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 100px auto; text-align: center; color: #333; }
    .card { padding: 30px; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .g_id_signin { display: flex; justify-content: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
    <h2>Paso 1: Identificación</h2>
    <p>Inicia sesión con tu cuenta de Google para comenzar.</p>

    <div id="g_id_onload"
            data-client_id="37856924939-qi4fjplvumnmr6pbecmoqkjs618tfm02.apps.googleusercontent.com"
            data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
    <p id="error" style="color:#b91c1c; margin-top:16px;"></p>
    </div>

<script>
function mostrarError(texto) {
    document.getElementById('error').textContent = texto;
}
async function handleCredentialResponse(response) {
    const idToken = response.credential; // El token que te da Google

    try {
        // 1. Intentamos loguearnos pegándole al primer endpoint
        const res = await fetch('/usuarios/auth/google', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ idToken })
        });

        const data = await res.json();

        // 2. CASO A: El usuario NO existe en la base de datos
        if (data.necesitaRegistro === true) {
            // Guardamos temporalmente el idToken en sessionStorage para usarlo después en el formulario
            sessionStorage.setItem('googleIdToken', idToken);
            
            // Redirigimos al usuario a la pantalla de registro para que pida teléfono y dirección
            window.location.href = '/registro.html';
            return;
        }

        // 3. CASO B: El usuario SÍ existe y se logueó con éxito
        if (data.token) {
            // Guardamos el JWT definitivo
            localStorage.setItem('token', data.token);
            
            // Redirigimos al dashboard o página principal de la app
            window.location.href = '/feedtrucho.html';
            return;
        }
        // 4. CUALQUIER OTRA RESPUESTA: el servidor no devolvió token ni pidió registro (por ejemplo, 401, 409 o 500).
        // Se muestra en pantalla para no quedar en silencio.
        console.error("Login con Google sin token. HTTP", res.status, data);
        mostrarError(data.mensaje || ("No se pudo iniciar sesión (HTTP " + res.status + ")"));
    } catch (error) {
        console.error("Error en la autenticación con Google:", error);
        alert("Ocurrió un error al intentar iniciar sesión.");
    }
}
</script>
</body>
</html>
