<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Registro - Google</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4285F4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #357ae8;
        }
        /* El Textbox grande para ver los errores */
        .error-box {
            margin-top: 15px;
            width: 100%;
            height: 100px;
            background: #222;
            color: #ff5555;
            font-family: monospace;
            font-size: 13px;
            padding: 8px;
            box-sizing: border-box;
            border: 2px solid #ff0000;
            border-radius: 4px;
            resize: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Completar Datos</h2>
        <form id="formRegistro">
            
            <div class="form-group">
                <label for="telefono">Teléfono *</label>
                <input type="tel" id="telefono" required placeholder="Ej: 3411234567">
            </div>

            <div class="form-group">
                <label for="direccion">Dirección *</label>
                <input type="text" id="direccion" required placeholder="Ej: Av. Corrientes 1234">
            </div>

            <div class="form-group">
                <label for="piso">Piso</label>
                <input type="number" id="piso" placeholder="Ej: 2">
            </div>

            <div class="form-group">
                <label for="depto">Departamento</label>
                <input type="text" id="depto" placeholder="Ej: B">
            </div>

            <div class="form-group">
                <label for="ciudad">Ciudad</label>
                <input type="text" id="ciudad" placeholder="Ej: Rosario">
            </div>

            <div class="form-group">
                <label for="provincia">Provincia</label>
                <input type="text" id="provincia" placeholder="Ej: Santa Fe">
            </div>

            <div class="form-group">
                <label for="pais">País</label>
                <input type="text" id="pais" value="Argentina">
            </div>

            <div class="form-group">
                <label for="codigo">Código Postal</label>
                <input type="text" id="codigo" placeholder="Ej: 2000">
            </div>

            <div class="form-group">
                <label>Categorías de interés * (elegí entre 1 y 4)</label>
                <div id="categorias"></div>
            </div>

            <button type="submit">Finalizar Registro</button>

            <!-- Textbox donde se va a escribir el error exacto -->
            <textarea id="txtError" class="error-box" readonly placeholder="Aquí aparecerá el error o respuesta de la API..."></textarea>
        </form>
    </div>

    <script>
        var txtError = document.getElementById('txtError');
        var contenedorCategorias = document.getElementById('categorias');

        // Verificamos el token al cargar
        var idToken = sessionStorage.getItem('googleIdToken');
        if (!idToken) {
            txtError.style.color = "#ff5555";
            txtError.value = "ERROR CRÍTICO: No se encontró 'googleIdToken' en el sessionStorage. Vuelve a index.html.";
        } else {
            txtError.style.color = "#55ff55";
            txtError.value = "Token de Google detectado correctamente. Listo para enviar.";
        }

        async function cargarCategorias() {
            try {
                var res = await fetch('/categorias');
                var data = await res.json();

                data.categorias.forEach(function (cat) {
                    var label = document.createElement('label');
                    label.style.fontWeight = "normal";
                    label.style.display = "block";

                    var checkbox = document.createElement('input');
                    checkbox.type = "checkbox";
                    checkbox.name = "categoriaInteres";
                    checkbox.value = cat.id_cat;
                    checkbox.style.width = "auto";
                    checkbox.style.display = "inline-block";
                    checkbox.style.marginRight = "8px";

                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(cat.categoria));
                    contenedorCategorias.appendChild(label);
                });
            } catch (err) {
                txtError.style.color = "#ff5555";
                txtError.value = "No se pudieron cargar las categorías: " + err.message;
            }
        }

        cargarCategorias();

        function obtenerCategoriasSeleccionadas() {
            var checkboxes = document.querySelectorAll('input[name="categoriaInteres"]:checked');
            return Array.from(checkboxes).map(function (checkbox) {
                return Number(checkbox.value);
            });
        }

        document.getElementById('formRegistro').addEventListener('submit', async function (e) {
            e.preventDefault();

            var categoriasInteres = obtenerCategoriasSeleccionadas();
            if (categoriasInteres.length < 1 || categoriasInteres.length > 4) {
                txtError.style.color = "#ff5555";
                txtError.value = "Elegí entre 1 y 4 categorías de interés.";
                return;
            }

            txtError.style.color = "#ffff55";
            txtError.value = "Enviando petición al servidor...";

            var datosRegistro = {
                idToken: idToken,
                telefono: document.getElementById('telefono').value,
                direccion: document.getElementById('direccion').value,
                piso: document.getElementById('piso').value,
                depto: document.getElementById('depto').value,
                pais: document.getElementById('pais').value || "Argentina",
                provincia: document.getElementById('provincia').value || "",
                ciudad: document.getElementById('ciudad').value || "",
                codigo: document.getElementById('codigo').value || "",
                categoriasInteres: categoriasInteres
            };

            try {
                const res = await fetch('/usuarios/auth/google/registro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datosRegistro)
                });

                const data = await res.json();

                if (res.ok) {
                    txtError.style.color = "#55ff55";
                    txtError.value = "¡EXITO! Status: " + res.status + "\n" + JSON.stringify(data, null, 2);
                    sessionStorage.removeItem('googleIdToken');
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                    }
                    setTimeout(function () {
                        window.location.href = '/feedtrucho.html';
                    }, 2500);
                } else {
                    txtError.style.color = "#ff5555";
                    txtError.value = "ERROR API (Status " + res.status + "):\n" + JSON.stringify(data, null, 2);
                }

            } catch (error) {
                txtError.style.color = "#ff5555";
                txtError.value = "EXCEPCIÓN DE FETCH / RED:\n" + error.message;
                console.error(error);
            }
        });
    </script>
</body>
</html>
